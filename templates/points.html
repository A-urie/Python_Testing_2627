{% extends "base.html" %}
{% block title %}Club points{% endblock %}
{% block content %}
<h1>Points of all clubs</h1>
<p class="muted">Public, read-only board. No login required.</p>
<div class="table-wrap">
    <table class="points-table">
        <thead>
            <tr>
                <th>Club</th>
                <th class="number">Points</th>
            </tr>
        </thead>
        <tbody>
            {% for club in clubs %}
            <tr>
                <td>{{ club['name'] }}</td>
                <td class="number">{{ club['points'] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
<p>
    <a class="btn btn-secondary" href="{{ url_for('index') }}">Back to login</a>
</p>
{% endblock %}
